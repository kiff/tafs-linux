name: Verify a draft release

# Run by hand with a draft's tag, before it's published: its own AppImage, checked against its
# SHA256SUMS, then started on a clean Ubuntu 24.04 by tools/check-appimage.sh, which fails on a
# library missing, an image loader that can't find its own, or an icon GTK can't load. Its three
# screenshots (the first screen, the sign-in, the sample signed in) are kept as the run's
# artifact; the AppImage isn't, since this repository is public.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The draft's tag, as v1.0.0"
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      # A draft release is listed only to a token that may write the repository's contents. This
      # job only reads it: it creates, edits and publishes nothing.
      contents: write
    steps:
      - name: The version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The version is v and three numbers, as v1.0.0: not '$VERSION'." >&2
            exit 1
          fi
      - name: The draft's AppImage and SHA256SUMS, checked
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir release
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$VERSION\" and .draft) | .id")
          if [ -z "$id" ]; then
            echo "No draft release $VERSION." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq '.[] | "\(.id) \(.name)"' |
            while read -r asset name; do
              case "$name" in
                tafs-*-x86_64.AppImage | SHA256SUMS)
                  gh api -H "Accept: application/octet-stream" \
                    "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "release/$name" ;;
              esac
            done
          cd release
          ls -l
          sha256sum -c SHA256SUMS
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Only for tools/check-appimage.sh: the token isn't written into .git/config.
          persist-credentials: false
          path: src
      - name: On a clean Ubuntu 24.04, its three screens with every icon
        run: |
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 \
            src/tools/check-appimage.sh "$(ls release/tafs-*-x86_64.AppImage)" release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-${{ inputs.version }}
          path: |
            release/first-screen.png
            release/sign-in.png
            release/sample.png
