name: AppImage

# tafs for Linux as the AppImage for Ubuntu, built on Ubuntu 24.04, whose glibc is its floor.
# On a pull request that changes the packaging, it's built, its own --help is run, and it's
# started on a clean Ubuntu 24.04 (tools/check-appimage.sh), as a check.
# Run by hand with a version, it's also attached to a **draft** release: publishing is the
# owner's yes, never this workflow's.
on:
  pull_request:
    paths:
      - tools/appimage.sh
      - tools/check-appimage.sh
      - tools/sign.sh
      - tools/verify-signature.sh
      - packaging/**
      - .github/workflows/appimage.yml
  workflow_dispatch:
    inputs:
      version:
        description: "The release's version, as v0.1.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A pull request: built and started, as a check. The file isn't kept: this repository is
  # public, and a run's artifact would be a copy anyone signed in to GitHub could download.
  appimage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The token isn't written into .git/config, where the build's code could read it.
          persist-credentials: false
      - name: GTK 4, libadwaita, and the icon theme to bundle
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev adwaita-icon-theme shared-mime-info file patchelf
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Words and contracts at the pin
        run: tools/sync.sh
      - name: Build
        run: cargo build --release -p tafs
      - name: AppImage
        run: tools/appimage.sh check
      - name: It starts
        # Its usage line and nothing else: no display, no keyring, nothing sent.
        run: |
          app=$(ls tafs-*-x86_64.AppImage)
          file "$app"
          APPIMAGE_EXTRACT_AND_RUN=1 "./$app" --help 2>&1 | grep -q '^tafs \['
      - name: On a clean Ubuntu 24.04, its screens with every icon, with GL and with no GL ES
        # tools/check-appimage.sh, in a container with no GTK. Its screenshots aren't kept.
        run: |
          mkdir -p shots
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 tools/check-appimage.sh "$(ls tafs-*-x86_64.AppImage)" shots
      - name: Signing, as a dry run with a throwaway key
        # The release's signing step, run with a key made here and thrown away, so the step is
        # known to work before the real key exists. Nothing signed here is kept.
        run: |
          sha256sum tafs-*-x86_64.AppImage > SHA256SUMS
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --quiet --pinentry-mode loopback --passphrase '' --quick-gen-key 'tafs dry run <dry-run@invalid>' ed25519 sign 1d
          TAFS_SIGNING_KEY=$(gpg --batch --armor --export-secret-keys) TAFS_SIGNING_PASSPHRASE='' tools/sign.sh SHA256SUMS
          test -s SHA256SUMS.asc
          rm -rf "$GNUPGHOME"
          unset GNUPGHOME
      - name: The release check refuses that key and takes the release key's own signature
        # tools/verify-signature.sh, as verify-release.yml runs it: the dry run's signature is by
        # another key, so it must fail; the last published release's is the real key's, so it
        # must pass. Only those two small files are downloaded. The latest release is read with
        # the job's own read-only token, so a busy runner isn't rate-limited.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dry && mv SHA256SUMS SHA256SUMS.asc dry/
          if tools/verify-signature.sh dry --require; then
            echo "A signature by another key passed." >&2
            exit 1
          fi
          mkdir published
          tag=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/kiff/tafs-linux/releases/latest | jq -r .tag_name)
          for f in SHA256SUMS SHA256SUMS.asc; do
            curl -fsSL -o "published/$f" "https://github.com/kiff/tafs-linux/releases/download/$tag/$f"
          done
          tools/verify-signature.sh published --require

  # Run by hand with a version: built, started, and attached to a draft release in the same job,
  # so the draft is its only copy. Never published from here.
  draft:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # The signing key's secrets live in this environment. While it holds none, the draft goes out
    # unsigned and says so; adding the key is a value, not a change here.
    environment: linux-signing
    permissions:
      contents: write
    steps:
      - name: The version, before anything is built or tagged
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The version is v and three numbers, as v0.1.0: not '$VERSION'." >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The token isn't written into .git/config, where the build's code could read it.
          persist-credentials: false
      - name: The version is the app's own, so it says which it is
        env:
          VERSION: ${{ inputs.version }}
        run: |
          app=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$app" != "$VERSION" ]; then
            echo "Cargo.toml says v$app, not $VERSION: bump it in a PR first." >&2
            exit 1
          fi
      - name: GTK 4, libadwaita, and the icon theme to bundle
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-4-dev libadwaita-1-dev adwaita-icon-theme shared-mime-info file patchelf
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Words and contracts at the pin
        run: tools/sync.sh
      - name: Build
        run: cargo build --release -p tafs
      - name: AppImage
        env:
          VERSION: ${{ inputs.version }}
        run: tools/appimage.sh "$VERSION"
      - name: It starts
        run: |
          app=$(ls tafs-*-x86_64.AppImage)
          file "$app"
          APPIMAGE_EXTRACT_AND_RUN=1 "./$app" --help 2>&1 | grep -q '^tafs \['
      - name: On a clean Ubuntu 24.04, its screens with every icon, with GL and with no GL ES
        # No draft is made of an AppImage that fails here. Its screenshots aren't kept.
        run: |
          mkdir -p shots
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 tools/check-appimage.sh "$(ls tafs-*-x86_64.AppImage)" shots
      - name: Its SHA-256, for the owner to check the download against
        run: sha256sum tafs-*-x86_64.AppImage | tee SHA256SUMS
      - name: SHA256SUMS signed, once the signing key exists
        # Only this step sees the key; the build's own code never does.
        env:
          TAFS_SIGNING_KEY: ${{ secrets.TAFS_SIGNING_KEY }}
          TAFS_SIGNING_PASSPHRASE: ${{ secrets.TAFS_SIGNING_PASSPHRASE }}
        run: tools/sign.sh SHA256SUMS
      - name: A draft release, never published from here
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          signature=$(ls SHA256SUMS.asc 2>/dev/null || true)
          # The release's notes in its languages, when they're in the repository; else one line.
          notes="packaging/release-notes/$VERSION.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --notes "The AppImage for Ubuntu 24.04 and newer (x86_64), with its SHA-256. A draft until the owner says yes."
          fi
          gh release create "$VERSION" tafs-*-x86_64.AppImage SHA256SUMS $signature \
            --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "tafs for Linux $VERSION" "$@"
