[workspace]
resolver = "2"
members = ["crates/tafs-core", "crates/tafs-app"]

[workspace.package]
version = "1.1.2"
edition = "2021"
license = "FSL-1.1-ALv2"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
